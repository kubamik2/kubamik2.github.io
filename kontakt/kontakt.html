<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandarynia</title>
    <link rel="stylesheet" href="../home/style.css" />
    <script defer src="kontakt.js"></script>
</head>

<body>
    <header>
        <h1>Witaj w Mandarynii</h1>
    </header>
    <hr>
    <nav>
        <a class="nav-item" href="../home/index.html">Home</a>
        <a class="nav-item" href="../galeria/galeria.html">Galeria</a>
        <a class="nav-item" href="../kontakt/kontakt.html">Kontakt</a>
    </nav>
    <hr>
    <main>
        <h1>Kontakt</h1>
        <form id="contact-form" method="post">
            <label for="email">E-Mail</label>
            <input type="text" name="email" id="email" placeholder="example@domain.com">
            <span class="error" id="email-error"></span>

            <label for="topic">Temat</label>
            <select id="topic">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
            <span class="error" id="topic-error"></span>

            <label for="msg">Wiadomość</label>
            <textarea name="msg" id="msg" placeholder="Napisz wiadomość" rows="3" maxlength="128"></textarea>
            <span class="error" id="msg-error"></span>

            <input type="submit" value="Wyślij">
        </form>
        <p id="time"></p>
    </main>
    <hr>
    <footer>
        <p>Jakub Mikuta</p>
    </footer>
</body>

</html>
